<html lang="zh-CN">
<head>

<title>国庆 · 锦绣诗球</title>
<style>
  /* ============ 全局重置与主题变量 ============ */
  :root{
    --china-red:#C8102E;      /* 中国红 */
    --china-red-deep:#8E0B1E; /* 深红 */
    --gold:#FFD700;           /* 金色 */
    --gold-soft:#F6E27A;      /* 柔金 */
    --space:#0A0A14;          /* 深空蓝黑 */
  }
  *{ margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{
    width:100%; height:100%; overflow:hidden;
    background:var(--space);
    font-family:"Microsoft YaHei","PingFang SC","Hiragino Sans GB","STKaiti","KaiTi",sans-serif;
    color:#fff;
    /* 移动端禁止页面滚动 / 橡皮筋 */
    overscroll-behavior:none;
    touch-action:none;
    -webkit-user-select:none; user-select:none;
  }
  /* 3D 画布铺满全屏 */
  #scene{ position:fixed; inset:0; width:100%; height:100%; display:block; touch-action:none; }

  /* ============ 顶部标题栏 ============ */
  #titleBar{
    position:fixed; top:0; left:0; right:0; z-index:20;
    padding:calc(env(safe-area-inset-top,0px) + 14px) 16px 10px;
    text-align:center; pointer-events:none;
    background:linear-gradient(to bottom, rgba(10,10,20,.55), rgba(10,10,20,0));
  }
  #titleBar h1{
    font-size:clamp(20px,5.2vw,34px);
    font-weight:800; letter-spacing:.14em;
    background:linear-gradient(180deg,#FFF6C9 0%,var(--gold) 45%,#E0A800 100%);
    -webkit-background-clip:text; background-clip:text; color:transparent;
    text-shadow:0 0 22px rgba(255,215,0,.28);
  }
  #titleBar .sub{
    margin-top:5px; font-size:clamp(10px,2.7vw,13px);
    letter-spacing:.34em; color:rgba(255,215,0,.72); font-weight:400;
  }
  #titleBar .stars-deco{ color:var(--gold); letter-spacing:.3em; font-size:11px; margin-top:3px; opacity:.85; }

  /* ============ 画质切换按钮组 ============ */
  #qualityBar{
    position:fixed; top:calc(env(safe-area-inset-top,0px) + 14px); right:12px; z-index:30;
    display:flex; gap:6px; background:rgba(20,10,14,.5);
    border:1px solid rgba(255,215,0,.32); border-radius:999px; padding:4px;
    backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px);
  }
  #qualityBar button{
    border:none; background:transparent; color:rgba(255,215,0,.6);
    font-size:12px; padding:5px 11px; border-radius:999px; cursor:pointer;
    font-family:inherit; transition:all .25s ease; letter-spacing:.05em;
  }
  #qualityBar button.active{
    background:linear-gradient(135deg,var(--china-red),#E8324A);
    color:#FFE9A8; box-shadow:0 0 12px rgba(200,16,46,.55); font-weight:700;
  }

  /* ============ 底部操作提示 ============ */
  #hint{
    position:fixed; bottom:calc(env(safe-area-inset-bottom,0px) + 16px); left:50%; transform:translateX(-50%);
    z-index:20; pointer-events:none; text-align:center;
    font-size:clamp(11px,3vw,13px); letter-spacing:.1em;
    color:rgba(255,235,180,.72);
    background:rgba(20,10,14,.42); border:1px solid rgba(255,215,0,.18);
    padding:7px 16px; border-radius:999px;
    backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px);
    transition:opacity .8s ease; white-space:nowrap;
  }
  #hint b{ color:var(--gold); font-weight:700; }

  /* ============ 帧率/计数信息（调试用，低调显示）============ */
  #stats{
    position:fixed; left:12px; bottom:calc(env(safe-area-inset-bottom,0px) + 16px); z-index:20;
    font-size:11px; color:rgba(255,215,0,.5); letter-spacing:.06em; pointer-events:none;
    font-family:ui-monospace,Menlo,Consolas,monospace;
  }

  /* ============ 加载动画 ============ */
  #loader{
    position:fixed; inset:0; z-index:100; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:22px;
    background:radial-gradient(circle at 50% 45%, #1a0d12 0%, var(--space) 70%);
    transition:opacity .8s ease; text-align:center; padding:20px;
  }
  #loader.hide{ opacity:0; pointer-events:none; }
  .spinner{
    width:64px; height:64px; border-radius:50%;
    border:3px solid rgba(255,215,0,.18); border-top-color:var(--gold);
    animation:spin 1s linear infinite; box-shadow:0 0 26px rgba(200,16,46,.4);
  }
  @keyframes spin{ to{ transform:rotate(360deg); } }
  #loader .lt{ font-size:17px; letter-spacing:.24em; color:var(--gold); }
  #loader .ls{ font-size:12px; letter-spacing:.1em; color:rgba(255,235,180,.55); max-width:320px; line-height:1.7; }
  #loader.err .spinner{ display:none; }
  #loader.err .lt{ color:#FF6B6B; }

  /* ============ 诗句详情卡片 ============ */
  #cardMask{
    position:fixed; inset:0; z-index:60; display:flex; align-items:center; justify-content:center;
    background:rgba(6,4,10,.62); backdrop-filter:blur(4px); -webkit-backdrop-filter:blur(4px);
    opacity:0; pointer-events:none; transition:opacity .32s ease; padding:22px;
  }
  #cardMask.show{ opacity:1; pointer-events:auto; }
  #poemCard{
    position:relative; width:min(430px,92vw); max-height:78vh; overflow:auto;
    padding:34px 28px 30px; border-radius:20px; text-align:center;
    background:linear-gradient(160deg,#B30E28 0%,var(--china-red) 42%,var(--china-red-deep) 100%);
    border:1.5px solid rgba(255,215,0,.6);
    box-shadow:0 18px 60px rgba(0,0,0,.6), 0 0 40px rgba(200,16,46,.4), inset 0 0 40px rgba(255,215,0,.06);
    transform:translateY(18px) scale(.94); opacity:0;
    transition:transform .38s cubic-bezier(.2,.9,.25,1.1), opacity .38s ease;
  }
  #cardMask.show #poemCard{ transform:translateY(0) scale(1); opacity:1; }
  /* 卡片四角金色装饰 */
  #poemCard::before,#poemCard::after{
    content:""; position:absolute; width:26px; height:26px; border:2px solid var(--gold); opacity:.75;
  }
  #poemCard::before{ top:12px; left:12px; border-right:none; border-bottom:none; border-radius:6px 0 0 0; }
  #poemCard::after{ bottom:12px; right:12px; border-left:none; border-top:none; border-radius:0 0 6px 0; }
  .card-type{
    display:inline-block; font-size:12px; letter-spacing:.18em; padding:4px 15px; border-radius:999px;
    color:#5A0716; background:linear-gradient(135deg,#FFF0B0,var(--gold));
    font-weight:700; box-shadow:0 3px 12px rgba(255,215,0,.35);
  }
  .card-star{ color:var(--gold); font-size:15px; letter-spacing:.4em; margin:16px 0 8px; text-shadow:0 0 12px rgba(255,215,0,.6); }
  #cardText{
    font-family:"STKaiti","KaiTi","Microsoft YaHei",serif;
    font-size:clamp(19px,5.4vw,26px); line-height:1.85; font-weight:700;
    color:#FFF7DC; text-shadow:0 2px 14px rgba(0,0,0,.4); letter-spacing:.04em;
    margin:6px 0 18px;
  }
  #cardAuthor{ font-size:14px; color:var(--gold-soft); letter-spacing:.16em; }
  #cardAuthor::before{ content:"—— "; opacity:.7; }
  #cardClose{
    position:absolute; top:12px; right:14px; width:30px; height:30px; border-radius:50%;
    border:1px solid rgba(255,215,0,.5); background:rgba(0,0,0,.2); color:var(--gold);
    font-size:17px; line-height:1; cursor:pointer; transition:all .2s ease; z-index:2;
  }
  #cardClose:hover{ background:var(--gold); color:var(--china-red-deep); transform:rotate(90deg); }
  .card-footer{ margin-top:20px; font-size:11px; letter-spacing:.2em; color:rgba(255,235,180,.5); }
</style>
</head>

  // ==================== 基础场景 / 相机 / 渲染器 ====================

  // ==================== 程序化国庆球体纹理 ====================
  // 在 Canvas 上绘制：中国红底 + 金色五角星 + 长城剪影 + 华表 + 烟花 + 祥云海浪
  function drawStar(ctx, cx, cy, spikes, outerR, innerR, rot = 0){
    let x = cx, y = cy;
    ctx.beginPath();
    for(let i = 0; i < spikes * 2; i++){
      const r = i % 2 === 0 ? outerR : innerR;
      const a = rot + (Math.PI / spikes) * i - Math.PI / 2;
      x = cx + Math.cos(a) * r; y = cy + Math.sin(a) * r;
      i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
    }
    ctx.closePath();

  function createPlanetTexture(){
    const W = 2048, H = 1024;
    const c = document.createElement('canvas'); c.width = W; c.height = H;
    const ctx = c.getContext('2d');

    // 1) 中国红纵向渐变底色（上下略深，中间鲜亮）
    const bg = ctx.createLinearGradient(0, 0, 0, H);
    bg.addColorStop(0.0, '#7E0A1B');
    bg.addColorStop(0.28,'#B30E28');
    bg.addColorStop(0.5, '#D2122E');
    bg.addColorStop(0.72,'#B30E28');
    bg.addColorStop(1.0, '#7E0A1B');
    ctx.fillStyle = bg; ctx.fillRect(0, 0, W, H);

    // 2) 中央暖光晕（模拟球面受光）
    const glow = ctx.createRadialGradient(W*0.5, H*0.42, 40, W*0.5, H*0.42, W*0.55);
    glow.addColorStop(0, 'rgba(255,120,90,0.30)');
    glow.addColorStop(1, 'rgba(255,60,60,0)');
    ctx.fillStyle = glow; ctx.fillRect(0, 0, W, H);

    // 3) 金色经纬装饰细线
    ctx.strokeStyle = 'rgba(255,215,0,0.10)'; ctx.lineWidth = 2;
    for(let i = 1; i < 12; i++){ const x = W/12*i; ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,H); ctx.stroke(); }
    for(let i = 1; i < 6; i++){ const y = H/6*i; ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(W,y); ctx.stroke(); }

    // 4) 顶部与底部金色回纹饰带
    const bandGrad = ctx.createLinearGradient(0,0,W,0);
    bandGrad.addColorStop(0,'rgba(255,215,0,0.0)');
    bandGrad.addColorStop(0.5,'rgba(255,215,0,0.55)');
    bandGrad.addColorStop(1,'rgba(255,215,0,0.0)');
    ctx.fillStyle = bandGrad;
    ctx.fillRect(0, H*0.055, W, 5);
    ctx.fillRect(0, H*0.915, W, 5);

    // 5) 散布金色五角星（大五星 + 小星群，寓意五星红旗）
    ctx.save();
    ctx.shadowColor = 'rgba(255,215,0,0.9)'; ctx.shadowBlur = 24;
    // 若干主星
    const bigStars = [[W*0.14,H*0.30,52],[W*0.5,H*0.20,64],[W*0.86,H*0.30,52],[W*0.30,H*0.62,34],[W*0.70,H*0.62,34]];
    bigStars.forEach(([sx,sy,sr])=>{
      ctx.fillStyle = 'rgba(255,225,120,0.92)';
      drawStar(ctx, sx, sy, 5, sr, sr*0.42); ctx.fill();
    });
    // 小星点缀
    ctx.fillStyle = 'rgba(255,215,0,0.75)';
    for(let i = 0; i < 90; i++){
      const sx = Math.random()*W, sy = Math.random()*H*0.86, sr = 4 + Math.random()*9;
      drawStar(ctx, sx, sy, 5, sr, sr*0.42, Math.random()*Math.PI); ctx.fill();
    }
    ctx.restore();

    // 6) 长城剪影（沿球体下部横贯，含垛口与烽火台）
    const wallY = H*0.70;
    ctx.save();
    ctx.fillStyle = 'rgba(60,6,16,0.55)';
    ctx.strokeStyle = 'rgba(255,215,0,0.30)'; ctx.lineWidth = 2;
    // 起伏的城墙基线
    ctx.beginPath(); ctx.moveTo(0, wallY+40);
    for(let x = 0; x <= W; x += 32){
      const y = wallY + Math.sin(x*0.006)*26 + Math.sin(x*0.017)*10;
      ctx.lineTo(x, y);
    }
    ctx.lineTo(W, H); ctx.lineTo(0, H); ctx.closePath(); ctx.fill();
    // 垛口
    ctx.fillStyle = 'rgba(40,4,12,0.6)';
    for(let x = 0; x < W; x += 46){
      const y = wallY + Math.sin(x*0.006)*26 + Math.sin(x*0.017)*10;
      ctx.fillRect(x, y-16, 22, 18);
    }
    // 烽火台（两座）
    [W*0.28, W*0.72].forEach(tx=>{
      const ty = wallY + Math.sin(tx*0.006)*26 - 6;
      ctx.fillStyle = 'rgba(48,5,14,0.72)';
      ctx.beginPath();
      ctx.moveTo(tx-42, ty+30); ctx.lineTo(tx-30, ty-46); ctx.lineTo(tx+30, ty-46); ctx.lineTo(tx+42, ty+30);
      ctx.closePath(); ctx.fill(); ctx.stroke();
      ctx.fillStyle = 'rgba(255,215,0,0.5)';
      for(let i=-1;i<=1;i++) ctx.fillRect(tx+i*20-4, ty-40, 8, 10);
    });
    ctx.restore();

    // 7) 烟花绽放（金色放射线 + 光点）
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    const fireworks = [[W*0.20,H*0.44,70],[W*0.62,H*0.36,86],[W*0.84,H*0.50,60],[W*0.42,H*0.52,54]];
    fireworks.forEach(([fx,fy,fr])=>{
      for(let i = 0; i < 26; i++){
        const a = Math.PI*2/26*i;
        const len = fr*(0.6 + Math.random()*0.5);
        const grd = ctx.createLinearGradient(fx, fy, fx+Math.cos(a)*len, fy+Math.sin(a)*len);
        grd.addColorStop(0,'rgba(255,240,180,0.85)');
        grd.addColorStop(1,'rgba(255,180,0,0)');
        ctx.strokeStyle = grd; ctx.lineWidth = 2.2;
        ctx.beginPath(); ctx.moveTo(fx, fy); ctx.lineTo(fx+Math.cos(a)*len, fy+Math.sin(a)*len); ctx.stroke();
        ctx.fillStyle = 'rgba(255,235,160,0.9)';
        ctx.beginPath(); ctx.arc(fx+Math.cos(a)*len, fy+Math.sin(a)*len, 2.4, 0, Math.PI*2); ctx.fill();
      }
    });
    ctx.restore();

    // 8) 底部海浪/祥云纹（金色弧线）
    ctx.save();
    ctx.strokeStyle = 'rgba(255,215,0,0.22)'; ctx.lineWidth = 3;
    for(let r = 0; r < 5; r++){

    }
    ctx.restore();

    const tex = new THREE.CanvasTexture(c);
    tex.colorSpace = THREE.SRGBColorSpace;
    tex.anisotropy = Math.min(8, renderer.capabilities.getMaxAnisotropy());

  }

  // ==================== 星球本体 ====================
  const planetTex = createPlanetTexture();
  const planetGeo = new THREE.SphereGeometry(PLANET_RADIUS, isMobile ? 48 : 64, isMobile ? 48 : 64);

  // ==================== 圆形粒子贴图（径向渐变，供星空/粒子复用）====================
  function makeCircleTexture(){
    const s = 64; const c = document.createElement('canvas'); c.width = c.height = s;
    const x = c.getContext('2d');
    const g = x.createRadialGradient(s/2, s/2, 0, s/2, s/2, s/2);

  const circleTex = makeCircleTexture();

  // ==================== 深空星空（>=3000 粒子，球壳内随机分布）====================
  let starField;
  function createStarField(maxCount){
    const geo = new THREE.BufferGeometry();
    const pos = new Float32Array(maxCount * 3);
    const col = new Float32Array(maxCount * 3);
    const c = new THREE.Color();
    for(let i = 0; i < maxCount; i++){
      const r = 8 + Math.random() * 40;                 // 半径 8~48 的球壳
      const theta = Math.random() * Math.PI * 2;
      const phi = Math.acos(2 * Math.random() - 1);
      pos[i*3]   = r * Math.sin(phi) * Math.cos(theta);
      pos[i*3+1] = r * Math.sin(phi) * Math.sin(theta);
      pos[i*3+2] = r * Math.cos(phi);
      const t = Math.random();
      if(t > 0.86) c.setHSL(0.12, 0.95, 0.62 + Math.random()*0.18);      // 少量金色星
      else if(t > 0.7) c.setHSL(0.02, 0.7, 0.7);                          // 少量暖红星

      col[i*3] = c.r; col[i*3+1] = c.g; col[i*3+2] = c.b;
    }
    geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
    geo.setAttribute('color', new THREE.BufferAttribute(col, 3));
    const mat = new THREE.PointsMaterial({
      size: 0.16, sizeAttenuation: true, map: circleTex, vertexColors: true,

  // ==================== 1949 金色表面粒子（BufferGeometry + Points）====================
  let surfacePoints;
  function createSurfaceParticles(count){

      size: 0.028, map: circleTex, color: COLOR.gold, transparent: true, opacity: 0.92,

    });
    return new THREE.Points(geo, mat);

  surfacePoints.frustumCulled = false;
  planetGroup.add(surfacePoints);   // 随星球一起自转

  // ==================== 上升金色烟花粒子（<=300）====================
  const fireworks = { pts: null, vel: null, count: FIREWORK_BASE, top: 3.2, bottom: -3.2 };
  function createFireworks(count){
    const geo = new THREE.BufferGeometry();
    const pos = new Float32Array(count * 3);
    const vel = new Float32Array(count);
    for(let i = 0; i < count; i++){

      pos[i*3+1] = fireworks.bottom + Math.random() * (fireworks.top - fireworks.bottom);

    });

  }
  scene.add(createFireworks(FIREWORK_BASE));

  // ==================== 77 句诗词文字精灵（Fibonacci 球面均匀分布）====================
  const texCache = new WeakMap();      // 纹理缓存（WeakMap，随 poem 对象回收）
  const textSprites = [];              // 所有文字精灵
  const _tmpVec = new THREE.Vector3();

  // 文本按标点/长度换行（避免使用 lookbehind，兼容旧版 iOS Safari）
  function wrapText(text, maxPerLine){
    const puncts = '，。！？、；：';
    const parts = []; let buf = '';
    for(const ch of text){ buf += ch; if(puncts.indexOf(ch) >= 0){ parts.push(buf); buf = ''; } }
    if(buf) parts.push(buf);
    const lines = []; let cur = '';
    parts.forEach(p => {
      if((cur + p).length <= maxPerLine) cur += p;
      else {
        if(cur) lines.push(cur);
        let q = p;
        while(q.length > maxPerLine){ lines.push(q.slice(0, maxPerLine)); q = q.slice(maxPerLine); }
        cur = q;
      }
    });
    if(cur) lines.push(cur);
    return lines.length ? lines : [text];
  }

  // 用 Canvas 动态生成金色发光文字纹理
  function makeTextTexture(poem){
    const cached = texCache.get(poem);
    if(cached) return cached;
    const dpr = 2, fontSize = 34, lineH = fontSize * 1.3, padX = 16, padY = 14;
    const lines = wrapText(poem.text, 10);
    const mctx = document.createElement('canvas').getContext('2d');
    mctx.font = `bold ${fontSize}px "Microsoft YaHei","STKaiti",sans-serif`;
    let maxW = 0; lines.forEach(l => maxW = Math.max(maxW, mctx.measureText(l).width));
    const wCss = Math.ceil(maxW + padX * 2);
    const hCss = Math.ceil(lines.length * lineH + padY * 2);
    const c = document.createElement('canvas');
    c.width = Math.ceil(wCss * dpr); c.height = Math.ceil(hCss * dpr);
    const ctx = c.getContext('2d');
    ctx.scale(dpr, dpr);
    ctx.font = `bold ${fontSize}px "Microsoft YaHei","STKaiti",sans-serif`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.lineJoin = 'round';
    // 先深色描边增强与红球的对比
    ctx.shadowBlur = 0; ctx.lineWidth = 4.5; ctx.strokeStyle = 'rgba(60,4,14,0.65)';
    lines.forEach((l, i) => ctx.strokeText(l, wCss/2, padY + lineH*i + lineH/2));
    // 再金色填充 + 发光
    ctx.shadowColor = 'rgba(255,190,50,0.95)'; ctx.shadowBlur = 16;
    ctx.fillStyle = '#FFEBAE';
    lines.forEach((l, i) => ctx.fillText(l, wCss/2, padY + lineH*i + lineH/2));
    const tex = new THREE.CanvasTexture(c);
    tex.colorSpace = THREE.SRGBColorSpace;
    tex.anisotropy = Math.min(4, renderer.capabilities.getMaxAnisotropy());
    const result = { tex, wCss, hCss };
    texCache.set(poem, result);
    return result;
  }

  // Fibonacci 球面均匀分布，避免极点聚集
  function fibonacciSphere(n, radius){
    const pts = [];
    const ga = Math.PI * (3 - Math.sqrt(5));   // 黄金角
    for(let i = 0; i < n; i++){
      const y = 1 - (i / (n - 1)) * 2;         // 1 -> -1
      const r = Math.sqrt(Math.max(0, 1 - y*y));
      const theta = ga * i;
      pts.push(new THREE.Vector3(Math.cos(theta) * r * radius, y * radius, Math.sin(theta) * r * radius));
    }
    return pts;
  }

  const WORLD_PER_PX = 0.0016;   // Canvas CSS 像素 → 世界单位 的换算比例
  function createTextSprites(){
    const positions = fibonacciSphere(POEMS.length, TEXT_RADIUS);
    POEMS.forEach((poem, i) => {
      const { tex, wCss, hCss } = makeTextTexture(poem);
      const mat = new THREE.SpriteMaterial({
        map: tex, transparent: true, depthWrite: false, depthTest: true, opacity: 0.96
      });
      const sprite = new THREE.Sprite(mat);
      sprite.position.copy(positions[i]);
      const sw = wCss * WORLD_PER_PX, sh = hCss * WORLD_PER_PX;
      sprite.scale.set(sw, sh, 1);
      sprite.userData = { poem, baseW: sw, baseH: sh, phase: Math.random() * Math.PI * 2, normal: positions[i].clone().normalize() };
      planetGroup.add(sprite);
      textSprites.push(sprite);
    });
  }
  createTextSprites();

  // ==================== 轨道控制器（阻尼 + 惯性）====================
  const controls = new OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;

  controls.zoomSpeed = 0.85;

  controls.maxDistance = 8;

  // ==================== 自动旋转（四元数，避免万向节死锁）====================
  const spinAxis = new THREE.Vector3(0, 1, 0);

  const SPIN_SPEED = 0.075;          // 弧度/秒，缓慢自转
  let autoSpin = true;
  let idleTimer = null;
  controls.addEventListener('start', () => { autoSpin = false; if(idleTimer) clearTimeout(idleTimer); });
  controls.addEventListener('end',   () => { if(idleTimer) clearTimeout(idleTimer); idleTimer = setTimeout(() => autoSpin = true, 3000); });

  // ==================== 点击拾取（Raycaster 检测 Sprite）====================
  const raycaster = new THREE.Raycaster();
  const pointerNdc = new THREE.Vector2();
  let downInfo = null;
  const cardMask = document.getElementById('cardMask');

  renderer.domElement.addEventListener('pointerdown', e => {
    downInfo = { x: e.clientX, y: e.clientY, t: performance.now() };
  });
  renderer.domElement.addEventListener('pointerup', e => {
    if(!downInfo) return;
    const dx = e.clientX - downInfo.x, dy = e.clientY - downInfo.y;
    const moved = Math.hypot(dx, dy), dt = performance.now() - downInfo.t;
    downInfo = null;
    if(moved < 9 && dt < 450) pickAt(e.clientX, e.clientY);   // 位移小 + 时间短 = 点击
  });

  function pickAt(cx, cy){
    pointerNdc.x = (cx / innerWidth) * 2 - 1;
    pointerNdc.y = -(cy / innerHeight) * 2 + 1;
    raycaster.setFromCamera(pointerNdc, camera);
    const visible = textSprites.filter(s => s.visible);
    const hits = raycaster.intersectObjects(visible, false);
    if(hits.length) showCard(hits[0].object.userData.poem);
  }

  // ==================== 诗句详情卡片 ====================
  const elType = document.getElementById('cardType');
  const elText = document.getElementById('cardText');
  const elAuthor = document.getElementById('cardAuthor');
  function showCard(poem){
    elType.textContent = poem.type;
    elText.textContent = poem.text;
    elAuthor.textContent = poem.author;
    cardMask.classList.add('show');
    controls.enabled = false;   // 卡片打开时暂停旋转，避免误操作
  }
  function hideCard(){ cardMask.classList.remove('show'); controls.enabled = true; }
  document.getElementById('cardClose').addEventListener('click', hideCard);
  cardMask.addEventListener('click', e => { if(e.target === cardMask) hideCard(); });
  window.addEventListener('keydown', e => { if(e.key === 'Escape') hideCard(); });

  // ==================== 泛光后处理（UnrealBloomPass）====================
  const composer = new EffectComposer(renderer);
  composer.addPass(new RenderPass(scene, camera));
  const bloomPass = new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), QUALITY_CFG[QUALITY].bloomStrength, 0.5, 0.82);
  composer.addPass(bloomPass);
  composer.addPass(new OutputPass());
  composer.setPixelRatio(QUALITY_CFG[QUALITY].pixelRatio);
  let useBloom = QUALITY_CFG[QUALITY].bloom;

  // ==================== 画质系统 + 帧率自适应 ====================
  const QLABEL = { high: '高清', medium: '流畅', low: '省电' };
  const statsEl = document.getElementById('stats');
  const qButtons = [...document.querySelectorAll('#qualityBar button')];

  function applyQuality(q, fromUser){
    QUALITY = q; const cfg = QUALITY_CFG[q];
    renderer.setPixelRatio(cfg.pixelRatio);
    composer.setPixelRatio(cfg.pixelRatio);
    // 星空：用 drawRange 控制绘制数量（几何体只创建一次）
    starField.geometry.setDrawRange(0, Math.floor(STAR_COUNT_BASE * cfg.starScale));
    // 表面金粒子
    surfacePoints.geometry.setDrawRange(0, Math.floor(SURF_PARTICLE_BASE * cfg.surfScale));
    // 烟花粒子
    fireworks.pts.geometry.setDrawRange(0, Math.floor(FIREWORK_BASE * cfg.firework));
    // 泛光开关
    useBloom = cfg.bloom; bloomPass.strength = cfg.bloomStrength;
    // 按钮高亮
    qButtons.forEach(b => b.classList.toggle('active', b.dataset.q === q));
    if(fromUser) statsEl.textContent = '画质：' + QLABEL[q];
  }
  qButtons.forEach(b => b.addEventListener('click', () => { autoDowngrade = false; applyQuality(b.dataset.q, true); }));

  let autoDowngrade = true;   // 用户手动选择后停止自动降级
  function downgrade(){
    if(QUALITY === 'high') applyQuality('medium');
    else if(QUALITY === 'medium') applyQuality('low');
  }

  // ==================== 文字精灵：背面裁剪 + 呼吸动画 ====================
  const _camDir = new THREE.Vector3();
  function updateTextSprites(time){
    planetGroup.updateMatrixWorld();
    const camPos = camera.position;
    for(let i = 0; i < textSprites.length; i++){
      const s = textSprites[i];
      s.getWorldPosition(_tmpVec);
      // 法线（球心→精灵），与「精灵→相机」方向点积 > 0 才在可见半球
      _camDir.copy(camPos).sub(_tmpVec).normalize();
      const normal = _tmpVec.clone().normalize();
      const facing = normal.dot(_camDir);
      s.visible = facing > 0.12;
      if(!s.visible) continue;
      // 呼吸：轻微缩放 + 透明度浮动；边缘处淡出更自然
      const breath = 1 + Math.sin(time * 1.6 + s.userData.phase) * 0.07;
      const edge = THREE.MathUtils.clamp((facing - 0.12) / 0.35, 0, 1);
      s.scale.set(s.userData.baseW * breath, s.userData.baseH * breath, 1);
      s.material.opacity = (0.55 + 0.45 * edge) * (0.9 + 0.1 * Math.sin(time * 2 + s.userData.phase));
    }
  }

  // ==================== 烟花上升动画 ====================
  function updateFireworks(dt){
    const pos = fireworks.pts.geometry.attributes.position;
    const arr = pos.array, vel = fireworks.vel;
    const n = fireworks.pts.geometry.drawRange.count === Infinity ? fireworks.count : fireworks.pts.geometry.drawRange.count;
    for(let i = 0; i < n; i++){
      arr[i*3+1] += vel[i] * dt * 60;
      if(arr[i*3+1] > fireworks.top){
        arr[i*3+1] = fireworks.bottom;
        arr[i*3]   = (Math.random() - 0.5) * 7.5;
        arr[i*3+2] = (Math.random() - 0.5) * 7.5;
      }
    }
    pos.needsUpdate = true;
  }

  // ==================== 主循环 ====================
  const clock = new THREE.Clock();
  let frames = 0, fpsTimer = performance.now(), lowStreak = 0;
  function animate(){
    requestAnimationFrame(animate);
    const dt = Math.min(clock.getDelta(), 0.05);
    const t = clock.elapsedTime;

    // 星球自转（四元数）
    if(autoSpin){ spinQuat.setFromAxisAngle(spinAxis, SPIN_SPEED * dt); planetGroup.quaternion.premultiply(spinQuat); }
    // 星空极缓慢旋转，营造深邃感
    starField.rotation.y += dt * 0.004;
    // 表面金粒子微闪
    surfacePoints.material.opacity = 0.78 + Math.sin(t * 2.2) * 0.14;
    // 光晕轻微脉动
    glowMat.uniforms.power.value = 2.6 + Math.sin(t * 0.8) * 0.25;

    updateTextSprites(t);
    updateFireworks(dt);
    controls.update();

    if(useBloom) composer.render(); else renderer.render(scene, camera);

    // 帧率监测：连续低于 30fps 自动降级
    frames++;
    const now = performance.now();
    if(now - fpsTimer >= 1000){
      const fps = frames * 1000 / (now - fpsTimer);
      frames = 0; fpsTimer = now;
      statsEl.textContent = `FPS ${fps.toFixed(0)} · ${QLABEL[QUALITY]}`;
      if(autoDowngrade){
        if(fps < 30){ lowStreak++; if(lowStreak >= 2){ downgrade(); lowStreak = 0; } }
        else lowStreak = 0;
      }
    }
  }

  // ==================== 自适应窗口 ====================
  function onResize(){
    const w = innerWidth, h = innerHeight;
    camera.aspect = w / h; camera.updateProjectionMatrix();
    renderer.setSize(w, h);
    composer.setSize(w, h);
    bloomPass.setSize(w, h);
  }
  window.addEventListener('resize', onResize);
  window.addEventListener('orientationchange', () => setTimeout(onResize, 200));

  // ==================== 移动端：禁止页面滚动 / 双击缩放 / 手势缩放 ====================
  document.addEventListener('gesturestart', e => e.preventDefault());
  document.addEventListener('gesturechange', e => e.preventDefault());
  document.addEventListener('dblclick', e => e.preventDefault(), { passive: false });
  let lastTouchEnd = 0;
  document.addEventListener('touchend', e => {
    const now = Date.now();
    if(now - lastTouchEnd <= 300) e.preventDefault();   // 拦截双击缩放
    lastTouchEnd = now;
  }, { passive: false });
  document.addEventListener('touchmove', e => { if(e.touches.length > 1) e.preventDefault(); }, { passive: false });

  // ==================== 启动 ====================
  applyQuality(QUALITY);
  onResize();
  animate();
  window.__poemBallReady = true;
  // 隐藏加载动画
  requestAnimationFrame(() => {
    const loader = document.getElementById('loader');
    loader.classList.add('hide');
    setTimeout(() => loader.style.display = 'none', 850);
  });
  // 操作提示 9 秒后淡出
  setTimeout(() => { const h = document.getElementById('hint'); if(h) h.style.opacity = '0'; }, 9000);

  // 便捷调试入口：window.setQuality('low') 可在控制台切换画质
  window.setQuality = q => { autoDowngrade = false; applyQuality(q, true); };
  </script>
</body>
</html>
